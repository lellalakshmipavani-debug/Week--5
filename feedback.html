
<!DOCTYPE html>
<html>
<head>
    <title>Movie Review</title>
</head>
<body>

    <h2>Movie Review Form</h2>

    <form>
        <label>Movie Name:</label>
        <select>
            <option>Gabbar Singh</option>
            <option>Baahubali: The Beginning</option>
            <option>Baahubali: The Conclusion</option>
            <option>Kushi</option>
            <option>Badri</option>
            <option>Thammudu</option>
            <option>Rangasthalam</option>
            <option>Sita Ramam</option>
            <option>Hi Nanna</option>
            <option>Panja</option>
            <option>Devara</option>
            <option>Geetha Govindam</option>
            <option>Fidaa</option>
            <option>Magadheera</option>
        </select>
        <br><br>

        <label>Your Name:</label>
        <input type="text">
        <br><br>

        <label>Rating:</label>
        <select>
            <option>5 - Excellent</option>
            <option>4 - Very Good</option>
            <option>3 - Good</option>
            <option>2 - Average</option>
            <option>1 - Poor</option>
        </select>
        <br><br>

        <label>Review:</label><br>
        <textarea rows="5" cols="30"></textarea>
        <br><br>

        <input type="submit" value="Submit Review">

    </form>

</body>
</html>
